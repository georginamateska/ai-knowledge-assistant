<aside class="sidebar">
  <span class="icon logo-icon"></span>

  <nav>
    @for (item of navItems; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [attr.title]="item.label"
      >

        <img class="nav-img" [src]="item.img" [alt]="item.label" />
      </a>
    }
  </nav>
</aside>
